[package]
name = "duckwalk"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Duckwalk's desktop app: lets Harold see when you're working"
publish = false

[[bin]]
name = "duckwalk"
path = "src/main.rs"

[dependencies]
auto-launch = "0.6.0"
dirs = "7.0.0"
hidapi = "2"
png = "0.18.1"
single-instance = "0.3.3"
tao = "0.37.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tray-icon = "0.26"
uuid = "1"

# Bluetooth: btleplug on macOS and Linux. On Windows btleplug only finds
# devices that advertise, and a connected Harold doesn't, so Windows looks up
# his paired GATT service through WinRT instead (decision record 0002).
[target.'cfg(not(windows))'.dependencies]
btleplug = "0.11"
futures = "0.3"

# Seeing your input on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = true

[build-dependencies]
winresource = "0.1.34"
