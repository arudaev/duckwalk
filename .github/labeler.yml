# Path-based area labels for pull requests (actions/labeler v5 syntax).
area:docs:
  - changed-files:
      - any-glob-to-any-file: ['docs/**', '*.md']
area:delivery:
  - changed-files:
      - any-glob-to-any-file: ['.github/**', 'scripts/**']
area:app:
  - changed-files:
      - any-glob-to-any-file: ['app/**']
area:usb:
  - changed-files:
      - any-glob-to-any-file: ['app/usb/**']
area:ble:
  - changed-files:
      - any-glob-to-any-file: ['app/ble/**']
area:desktop:
  - changed-files:
      - any-glob-to-any-file: ['desktop/**']
area:brand:
  - changed-files:
      - any-glob-to-any-file: ['brand/**', 'app/images/**', 'app/icon.png']
