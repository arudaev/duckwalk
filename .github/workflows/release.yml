name: Release

# Pushing a tag like v0.1 builds the Flipper app and the desktop app and leaves a draft
# release with them attached. The author reads it and publishes it. A tag like v0.1-rc1
# leaves a draft pre-release, which never becomes the "latest" release.

on:
  push:
    tags: ["v*"]
  # A dry run from the Actions tab: builds everything and checks the tag, releases nothing.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to check, like v0.1-rc1
        required: true
        default: v0.1-rc1

permissions:
  contents: read

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches fap_version
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 -m doctest scripts/release_tag.py
          out=$(python3 scripts/release_tag.py "$TAG")
          echo "$out" | tee -a "$GITHUB_OUTPUT"
      - name: Build duckwalk.fap
        uses: flipperdevices/flipperzero-ufbt-action@v0.1.4
        id: build
        with:
          app-dir: app
          sdk-channel: release
      - name: Say which firmware it's built for
        env:
          SUFFIX: ${{ steps.build.outputs.suffix }}
          API: ${{ steps.build.outputs.api-version }}
        run: echo "duckwalk.fap is built against the release firmware SDK, API $API ($SUFFIX)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: ${{ steps.build.outputs.fap-artifacts }}

  desktop:
    name: Desktop app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, ext: .exe }
          - { name: windows-arm64, os: windows-latest, target: aarch64-pc-windows-msvc, ext: .exe }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin, ext: "" }
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev pkg-config libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: desktop/app
        run: cargo build --release --target ${{ matrix.target }}
      - name: Name it for its system
        shell: bash
        run: cp "desktop/app/target/${{ matrix.target }}/release/duckwalk${{ matrix.ext }}" "duckwalk-desktop-${{ matrix.name }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: duckwalk-desktop-*

  draft:
    name: Draft release
    # Only a pushed tag releases; a manual run never does, whichever ref it's started from.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [app, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the build provenance: who built each file, from which commit.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add the Linux USB rule and the checksums
        working-directory: dist
        run: |
          test -f "../docs/releases/$GITHUB_REF_NAME.md" || { echo "Write docs/releases/$GITHUB_REF_NAME.md first"; exit 1; }
          cp ../desktop/app/linux/70-duckwalk.rules .
          sha256sum duckwalk.fap duckwalk-desktop-* 70-duckwalk.rules > SHA256SUMS
          cat SHA256SUMS
      - name: Attest where each file was built
        # Anyone can check a file with `gh attestation verify <file> --repo arudaev/duckwalk --signer-workflow arudaev/duckwalk/.github/workflows/release.yml`.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/duckwalk.fap
            dist/duckwalk-desktop-*
            dist/70-duckwalk.rules
            dist/SHA256SUMS
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.app.outputs.prerelease }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          test -f "$notes" || { echo "Write $notes first"; exit 1; }
          flag=""
          if [ "$PRERELEASE" = "true" ]; then flag="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --draft $flag --title "Duckwalk $GITHUB_REF_NAME" \
            --notes-file "$notes" dist/duckwalk.fap dist/duckwalk-desktop-* dist/70-duckwalk.rules dist/SHA256SUMS
