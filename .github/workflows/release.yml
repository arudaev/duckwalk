name: Release

# Pushing a tag like v0.1 builds the Flipper app and the desktop app and leaves a draft
# release with them attached. The author reads it and publishes it.

on:
  push:
    tags: ["v*"]
  # A dry run from the Actions tab: builds everything, releases nothing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build duckwalk.fap
        uses: flipperdevices/flipperzero-ufbt-action@v0.1.4
        id: build
        with:
          app-dir: app
          sdk-channel: release
      - name: Check the tag matches fap_version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/.*fap_version="\([^"]*\)".*/\1/p' app/application.fam)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME, but fap_version is $version"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: ${{ steps.build.outputs.fap-artifacts }}

  desktop:
    name: Desktop app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, ext: .exe }
          - { name: windows-arm64, os: windows-latest, target: aarch64-pc-windows-msvc, ext: .exe }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin, ext: "" }
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev pkg-config libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: desktop/app
        run: cargo build --release --target ${{ matrix.target }}
      - name: Name it for its system
        shell: bash
        run: cp "desktop/app/target/${{ matrix.target }}/release/duckwalk${{ matrix.ext }}" "duckwalk-desktop-${{ matrix.name }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: duckwalk-desktop-*

  draft:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [app, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          test -f "$notes" || { echo "Write $notes first"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --draft --title "Duckwalk $GITHUB_REF_NAME" \
            --notes-file "$notes" dist/*.fap dist/duckwalk-desktop-*
