name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S tests -B build/tests
          cmake --build build/tests
      - name: Run
        run: ctest --test-dir build/tests --output-on-failure
