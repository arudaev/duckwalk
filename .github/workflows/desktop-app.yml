name: Desktop app

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/app
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev pkg-config libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/app
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: duckwalk-desktop-${{ runner.os }}
          path: |
            desktop/app/target/release/duckwalk
            desktop/app/target/release/duckwalk.exe
          if-no-files-found: error

  efficiency:
    # The budget in docs/efficiency.md, at rest and without a Flipper.
    # Linux reports only, until it has a baseline of its own.
    name: Efficiency (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, budget: windows-ci, exe: duckwalk.exe }
          - { os: ubuntu-latest, budget: linux, exe: duckwalk }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: duckwalk-desktop-${{ runner.os }}
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install psutil
      - name: Linux libraries and a screen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libayatana-appindicator3-1 libxdo3
          chmod +x app/duckwalk
      - name: Measure
        shell: bash
        run: |
          run=""
          if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a dbus-run-session --"; fi
          set +e
          $run python scripts/efficiency/measure.py --exe "app/${{ matrix.exe }}" --budget ${{ matrix.budget }} --report efficiency.md
          code=$?
          if [ -f efficiency.md ]; then cat efficiency.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: efficiency-${{ runner.os }}
          path: efficiency.md
          if-no-files-found: ignore
